set -g extended-keys on
set -g renumber-windows on

set -a terminal-features "tmux-256color:RGB"
set -g cursor-style bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=color15"
set -g status-interval 5
set -g status-right "#[fg=color15,bg=colour3,bold] #S #[default]"
set -g status-left ""
set -g window-status-separator ""
set -g window-status-format "#[fg=colour7] #I: #W#{?window_zoomed_flag, Z,} #[default]"
set -g window-status-current-format "#{?client_prefix,#[bg=colour9 fg=colour9] ,}#[fg=colour0 bg=colour8 bold] #I: #W#{?window_zoomed_flag, Z,} #[default]"
set -g window-active-style "fg=default"
set -g pane-border-style "fg=color7"
set -g pane-active-border-style "fg=color7"
set -g message-style "fg=colour0,bg=colour15"
set -g message-command-style "fg=colour0,bg=colour15"

bind Enter copy-mode
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g mode-style "bg=colour7"
set -g copy-mode-match-style "bg=colour7"
set -g copy-mode-current-match-style "bg=colour11"

bind t new-window -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind -r + resize-pane -D 5
bind -r - resize-pane -U 5
bind x kill-pane
bind q kill-window

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind f choose-tree -Zs

bind r source-file "~/.config/tmux/tmux.conf"
